[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-stock-threshold-alert"
version = "1.0.0"
description = "Stock threshold alert plugin for InvenTree"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "InvenTree", email = "support@inventree.org"}
]
keywords = ["inventree", "stock", "threshold", "alert", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "inventree>=0.15.0",
]

[project.urls]
"Homepage" = "https://github.com/inventree/inventree-stock-threshold-alert"
"Repository" = "https://github.com/inventree/inventree-stock-threshold-alert"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools]
packages = ["stock_threshold_alert"]
include-package-data = true

[tool.setuptools.package-data]
stock_threshold_alert = ["static/*.js"]

[tool.inventree]
slug = "stock-threshold-alert"
